services:
  mesa:
    build: .
    restart: unless-stopped
    ports: ["8100:8100"]
    env_file: .env
    volumes:
      - ./dados:/app/dados
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/saude', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
