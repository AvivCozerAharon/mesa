[project]
name = "mesa"
version = "0.1.0"
description = "Terminal pessoal de investimentos: dados publicos, briefing diario por IA, tese por posicao"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2", "pyarrow>=17", "duckdb>=1.1", "yfinance>=0.2.50", "requests>=2.31",
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "apscheduler>=3.10,<4", "openai>=1.50",
  "feedparser>=6", "python-dotenv>=1", "python-multipart>=0.0.9",
]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
[tool.setuptools.packages.find]
include = ["mesa*"]
